name: Daily film brief

on:
  schedule:
    # Beijing time: 10:10 and 18:00 (GitHub Actions uses UTC).
    - cron: "10 2,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-film-brief-production
  cancel-in-progress: false

jobs:
  collect-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect traceable source items
        run: python automation/brief_pipeline.py --sources automation/sources.json --output generated/latest.json
      - name: Render daily page and archive yesterday
        id: render
        shell: bash
        run: |
          set +e
          python automation/render_daily.py --input generated/latest.json --site app
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "### Publication skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Required market coverage is incomplete. The existing Pages version was not changed." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Persist the generated briefing and archive
        if: steps.render.outputs.deploy == 'true'
        run: |
          git config user.name "daily-film-brief-bot"
          git config user.email "daily-film-brief-bot@users.noreply.github.com"
          git add app generated
          git diff --cached --quiet || git commit -m "chore: update daily film brief"
          git push
      - name: Deploy to the existing Cloudflare Pages project
        if: steps.render.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app --project-name=daily-film-brief
